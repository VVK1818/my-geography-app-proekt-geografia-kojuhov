<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторина по географии</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f172a 70%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .quiz-wrapper { max-width: 700px; width: 100%; }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            background: #334155;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }

        .back-btn:hover { background: #475569; }

        .score-badge {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #c084fc);
            width: 0%;
            transition: width 0.4s ease;
        }

        .quiz-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.5);
        }

        .question-num {
            font-size: 13px;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 22px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .flag-question-img {
            display: block;
            width: 200px;
            height: 130px;
            object-fit: cover;
            margin: 0 auto 25px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background: #0f172a;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            padding: 16px;
            border: 1px solid #334155;
            border-radius: 14px;
            background: #0f172a;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-family: inherit;
        }

        .option-btn:hover:not(:disabled) {
            background: #1e293b;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }

        .option-btn.correct {
            background: #22c55e !important;
            border-color: #22c55e !important;
            color: white;
            opacity: 1;
        }

        .option-btn.wrong {
            background: #ef4444 !important;
            border-color: #ef4444 !important;
            color: white;
            opacity: 1;
        }

        .result-msg {
            margin-top: 20px;
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            min-height: 24px;
        }

        .next-btn {
            display: none;
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .next-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Экран результата */
        .result-screen {
            display: none;
            text-align: center;
            padding: 50px 30px;
        }

        .result-screen h2 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-score {
            font-size: 22px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .result-grade {
            font-size: 56px;
            font-weight: 900;
            margin: 20px 0;
        }

        .result-comment {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .restart-btn {
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            font-family: inherit;
        }

        .restart-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="quiz-wrapper">
    <div class="quiz-header">
        <a href="index.html" class="back-btn">← На главную</a>
        <div class="score-badge" id="score-badge">Баллы: 0</div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="quiz-card" id="quiz-card">
        <div class="question-num" id="question-num">Вопрос 1 из 15</div>
        <div class="question-text" id="question-text">Загрузка...</div>
        <div id="flag-container"></div>
        <div class="options-grid" id="options"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="next-btn" id="next-btn">Следующий вопрос →</button>
    </div>

    <div class="quiz-card result-screen" id="result-screen">
        <h2>Викторина завершена!</h2>
        <div class="result-score" id="result-score"></div>
        <div class="result-grade" id="result-grade"></div>
        <div class="result-comment" id="result-comment"></div>
        <button class="restart-btn" onclick="location.reload()">Пройти ещё раз</button>
    </div>
</div>

<script src="quiz-data.js"></script>
<script>
    const TOTAL_QUESTIONS = 15;
    const QUESTION_TYPES = ['flag', 'capital', 'region', 'currency', 'lang', 'area'];

    let currentQuestion = 0;
    let score = 0;
    let currentType = null;
    let currentCountry = null;
    let correctAnswer = null;
    let answered = false;

    // Утилиты
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function pickUnique(arr, count, exclude) {
        const result = [];
        const used = new Set(exclude || []);
        let attempts = 0;
        while (result.length < count && attempts < 500) {
            attempts++;
            const item = pickRandom(arr);
            const key = typeof item === 'object' ? JSON.stringify(item) : item;
            if (!used.has(key)) {
                used.add(key);
                result.push(item);
            }
        }
        return result;
    }

    // Генерация вопроса
    function generateQuestion() {
        const type = pickRandom(QUESTION_TYPES);
        const country = pickRandom(QUIZ_DATA);
        let questionText = '';
        let answer = null;
        let options = [];

        if (type === 'flag') {
            questionText = 'Что это за страна?';
            answer = country.name;
            const wrongs = pickUnique(QUIZ_DATA, 3, [country.name]).map(c => c.name);
            options = shuffle([answer, ...wrongs]);
        }
        else if (type === 'capital') {
            questionText = `Какая столица у страны ${country.name}?`;
            answer = country.capital;
            const wrongs = pickUnique(QUIZ_DATA, 3, [country.capital]).map(c => c.capital);
            options = shuffle([answer, ...wrongs]);
        }
        else if (type === 'region') {
            questionText = `На каком континенте находится страна ${country.name}?`;
            answer = country.region;
            const allRegions = ['Европа', 'Азия', 'Африка', 'Америка', 'Океания'];
            const wrongs = allRegions.filter(r => r !== country.region);
            options = shuffle([answer, ...wrongs.slice(0, 3)]);
        }
        else if (type === 'currency') {
            questionText = `Какая валюта в стране ${country.name}?`;
            answer = country.currency;
            const wrongs = pickUnique(QUIZ_DATA, 3, [country.currency]).map(c => c.currency);
            options = shuffle([answer, ...wrongs]);
        }
        else if (type === 'lang') {
            questionText = `Какой официальный язык в стране ${country.name}?`;
            answer = country.lang;
            const wrongs = pickUnique(QUIZ_DATA, 3, [country.lang]).map(c => c.lang);
            options = shuffle([answer, ...wrongs]);
        }
        else if (type === 'area') {
            const bigger = Math.random() > 0.5;
            const others = QUIZ_DATA.filter(c => c.name !== country.name);
            let compared;
            if (bigger) {
                const candidates = others.filter(c => c.area > country.area * 1.3);
                compared = candidates.length ? pickRandom(candidates) : pickRandom(others);
                questionText = `Какая страна больше по площади: ${country.name} или ${compared.name}?`;
            } else {
                const candidates = others.filter(c => c.area < country.area * 0.7);
                compared = candidates.length ? pickRandom(candidates) : pickRandom(others);
                questionText = `Какая страна меньше по площади: ${country.name} или ${compared.name}?`;
            }
            answer = bigger
                ? (country.area > compared.area ? country.name : compared.name)
                : (country.area < compared.area ? country.name : compared.name);
            options = [country.name, compared.name];
        }

        return { type, country, questionText, answer, options };
    }

    // Отрисовка вопроса
    function renderQuestion() {
        const q = generateQuestion();
        currentType = q.type;
        currentCountry = q.country;
        correctAnswer = q.answer;
        answered = false;

        document.getElementById('question-num').textContent = `Вопрос ${currentQuestion + 1} из ${TOTAL_QUESTIONS}`;
        document.getElementById('question-text').textContent = q.questionText;
        document.getElementById('result-msg').textContent = '';
        document.getElementById('next-btn').style.display = 'none';

        // Флаг (только для типа «flag»)
        const flagContainer = document.getElementById('flag-container');
        if (q.type === 'flag') {
            flagContainer.innerHTML = `<img src="flags/${q.country.flag}.svg" class="flag-question-img" alt="Флаг">`;
        } else {
            flagContainer.innerHTML = '';
        }

        // Кнопки
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            optionsDiv.appendChild(btn);
        });

        // Прогресс
        document.getElementById('progress-fill').style.width = ((currentQuestion / TOTAL_QUESTIONS) * 100) + '%';
    }

    // Проверка ответа
    function checkAnswer(btn, chosen) {
        if (answered) return;
        answered = true;

        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => {
            b.disabled = true;
            if (b.textContent === correctAnswer) b.classList.add('correct');
        });

        if (chosen === correctAnswer) {
            score++;
            document.getElementById('score-badge').textContent = 'Баллы: ' + score;
            document.getElementById('result-msg').textContent = '✅ Правильно!';
            document.getElementById('result-msg').style.color = '#22c55e';
        } else {
            btn.classList.add('wrong');
            document.getElementById('result-msg').textContent = '❌ Неверно. Правильный ответ: ' + correctAnswer;
            document.getElementById('result-msg').style.color = '#ef4444';
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    // Следующий вопрос
    document.getElementById('next-btn').addEventListener('click', () => {
        currentQuestion++;
        if (currentQuestion >= TOTAL_QUESTIONS) {
            showResult();
        } else {
            renderQuestion();
        }
    });

    // Итог
    function showResult() {
        document.getElementById('quiz-card').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('progress-fill').style.width = '100%';

        document.getElementById('result-score').textContent = `Ты ответил правильно на ${score} из ${TOTAL_QUESTIONS} вопросов`;

        let grade, comment, color;
        if (score >= 14) { grade = 5; comment = 'Отлично! Ты настоящий знаток географии!'; color = '#22c55e'; }
        else if (score >= 11) { grade = 4; comment = 'Хороший результат! Почти идеально.'; color = '#38bdf8'; }
        else if (score >= 8) { grade = 3; comment = 'Удовлетворительно. Можно подтянуть знания!'; color = '#f59e0b'; }
        else { grade = 2; comment = 'Слабовато. Попробуй изучить страны и пройти ещё раз!'; color = '#ef4444'; }

        const g = document.getElementById('result-grade');
        g.textContent = 'Оценка: ' + grade;
        g.style.color = color;
        document.getElementById('result-comment').textContent = comment;
    }

    // Старт
    renderQuestion();
</script>

</body>
</html>
